    <tspan x="20" dy="0">A classic "Thursday afternoon hero," you</tspan>
    
    <tspan x="20" dy="18">operate on a highly efficient cycle of</tspan>
    
    <tspan x="20" dy="18">post-lunch caffeine spikes at 2:00 PM and a</tspan>
    
