    <tspan x="20" dy="18">Friday" minimalism. Why write multiple files</tspan>
    
    <tspan x="20" dy="18">when one giant file and eight perfectly timed</tspan>
    
    <tspan x="20" dy="18">commits do the trick?</tspan>
    
